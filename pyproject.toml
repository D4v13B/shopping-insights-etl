[project]
name = "shopping-etl"
version = "1.0.0"
description = "ETL de Shopping Insights: extrae, valida, transforma y carga el dataset Customer Shopping Trends"
requires-python = ">=3.13"
dependencies = [
    "polars>=2.0",
    "pandera[polars]>=0.34",
    "psycopg[binary]>=3.3",
    "structlog>=26.1",
    "kagglehub>=1.0",
    "pydantic-settings>=2.16",
    "typer>=0.27",
]

[project.scripts]
shopping-etl = "shopping_etl.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_etl"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["shopping_etl"]

[[tool.mypy.overrides]]
module = ["kagglehub", "kagglehub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere un PostgreSQL (TEST_DATABASE_URL)"]
